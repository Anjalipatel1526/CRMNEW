name: UNAI CRM CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint --workspace=apps/web

      - name: Financial Calculation Integrity Test Suite (Phase C)
        run: node --experimental-strip-types scripts/test-financial-integrity.mjs

      - name: Runtime Request Validation Test Suite (Phase F)
        run: node --experimental-strip-types scripts/test-validation-security.mjs

      - name: Session Security & Cryptographic Route Guard Tests (Phase B)
        run: node --experimental-strip-types scripts/test-session-security.mjs

      - name: Production Next.js Build
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://rastqlhojjtpuaikxhvm.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SIGNING_SECRET: ${{ secrets.SESSION_SIGNING_SECRET || 'ci-testing-session-secret-key-at-least-32-chars!' }}
